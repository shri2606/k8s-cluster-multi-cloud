---
- name: Add Argo Helm repo
  shell: helm repo add argo https://argoproj.github.io/argo-helm && helm repo update
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Install Argo CD
  shell: |
    helm upgrade --install argocd argo/argo-cd \
      --version {{ argocd_chart_version }} \
      --namespace argocd --create-namespace \
      --set global.nodeSelector.cloud=azure \
      --set dex.enabled=false \
      --set notifications.enabled=false \
      --wait --timeout 10m
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Install Argo CD CLI
  get_url:
    url: https://github.com/argoproj/argo-cd/releases/download/{{ argocd_cli_version }}/argocd-linux-amd64
    dest: /usr/local/bin/argocd
    mode: '0755'

- name: Copy root Application
  copy:
    src: "{{ playbook_dir }}/gitops/bootstrap/root-app.yaml"
    dest: /tmp/root-app.yaml

- name: Apply root Application
  command: kubectl apply -f /tmp/root-app.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Read initial admin password
  shell: kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: argocd_password
  changed_when: false

- name: Print Argo CD access info
  debug:
    msg:
      - "UI: ssh -i terraform_key.pem -L 8080:localhost:8080 ubuntu@{{ inventory_hostname }}"
      - "    then on master: kubectl -n argocd port-forward svc/argocd-server 8080:443"
      - "    open https://localhost:8080  (user: admin)"
      - "Password: {{ argocd_password.stdout }}"
