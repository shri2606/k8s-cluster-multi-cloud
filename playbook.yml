---
- name: Install k3s master
  hosts: master
  roles:
    - kubernetes_master

- name: Install k3s workers
  hosts: worker
  roles:
    - kubernetes_worker

- name: Install Cilium
  hosts: master
  roles:
    - cilium

- name: Verify cluster
  hosts: master
  tasks:
    - name: Get node status
      command: k3s kubectl get nodes -o wide
      register: nodes
      changed_when: false

    - name: Print node status
      debug:
        msg: "{{ nodes.stdout_lines }}"
